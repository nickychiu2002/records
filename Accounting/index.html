<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>記帳工具</title>
<link rel="stylesheet" href="style.css">
<!-- font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=TASA+Orbiter:wght@400..800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+P+One&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Zen+Antique&display=swap" rel="stylesheet">

</head>

<body>
    <div class="container">

        <header>
            <h1>記帳</h1>
        </header>

        <div class="summary">
            <div class="income_div">
                <div id="income_title">本月收入</div>
                <div id="income">NT$0</div>
            </div>
            <div class="expense_div">
                <div id="expense_title">本月支出</div>
                <div id="expense">NT$0</div>
            </div>
        </div>

        <div class="date_div">
            <input type="date" id="date">
        </div>
        
        <div class="type_div">
            <select id="type" required>
                <option value="" selected disabled>收入</option>
                <option value="收入">收入</option>
                <option value="支出">支出</option>
            </select>
        </div>

        <div class="category_div">
            <select id="category" required>
                <option value=""  disabled selected>分類</option>
            </select>
        </div>
        
        <div class="amount_div">
            <input type="number" inputmode="numeric" id="amount" class="placeholder" placeholder="金額">
        </div>

        <div class="note_div">
            <input type="text" id="note" class="placeholder" placeholder="備註" style="justify-content:center; align-items: center;"></input>
        </div>
        
        <div class="save_div">
            <button id="save">儲存</button>
        </div>
        
        <div class="sheetBtn_div">
            <a id="sheetBtn" target="_blank" herf="https://docs.google.com/spreadsheets/d/1dFYidVyTWDljbhNwUR7ASsZ80_0g8gNl7f6Z1NHMHqE/edit?usp=sharing">Google Sheet</a>
        </div>
        
    </div>

    <script src="script.js"></script>

    </body>
</html>
